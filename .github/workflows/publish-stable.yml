name: Publish signed stable APK

# Manually publish once the owner has confirmed the signing secrets.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-release-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish v1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4

      - name: Verify release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/stable-v1.0.0"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "::error::v1.0.0 already exists; refusing to overwrite a published release"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (required)
        env:
          KEYSTORE_B64: ${{ secrets.LIBREBUDS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LIBREBUDS_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/release-keystore.jks
          chmod 600 android/release-keystore.jks

          # This fork's new key uses a single private-key entry and the SAME
          # password for the keystore and the key. Recover the alias directly
          # from the keystore instead of relying on copied alias/key-password secrets.
          if ! keytool -list -v \
              -keystore android/release-keystore.jks \
              -storepass "$STORE_PASSWORD" > "$RUNNER_TEMP/key-list.txt" 2>/dev/null; then
            echo "::error::Cannot open signing keystore with LIBREBUDS_STORE_PASSWORD. Check both the keystore Base64 and store password."
            exit 1
          fi
          alias_count="$(grep -c '^Alias name: ' "$RUNNER_TEMP/key-list.txt" || true)"
          if [ "$alias_count" != "1" ]; then
            echo "::error::Expected a single signing key in the fork keystore; found $alias_count."
            exit 1
          fi
          actual_alias="$(sed -n 's/^Alias name: //p' "$RUNNER_TEMP/key-list.txt" | head -n 1)"
          test -n "$actual_alias"

          {
            printf 'RELEASE_STORE_FILE=release-keystore.jks\n'
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$actual_alias"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$STORE_PASSWORD"
          } > android/keystore.properties
          chmod 600 android/keystore.properties
          rm -f "$RUNNER_TEMP/key-list.txt"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify new fork signature and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$candidate"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt"

          "$apksigner" verify --print-certs "$candidate" > "$RUNNER_TEMP/new-certificate.txt"
          new_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-certificate.txt" | head -n 1)"
          test -n "$new_cert"

          # The fork intentionally starts a NEW signing lineage with v1.0.0.
          # Pin this public certificate fingerprint to prevent a mistakenly supplied key
          # from becoming the permanent signing identity of future releases.
          expected_cert="d71be050b3c96de6634a1a136126ae788ef8ad35efea8fb98858c35fc8d85d6"
          normalized_cert="$(printf '%s' "$new_cert" | tr '[:upper:]' '[:lower:]' | tr -cd '0-9a-f')"
          if [ "$normalized_cert" != "$expected_cert" ]; then
            echo "::error::APK does not use the intended LibreBuds 6i fork release-signing certificate."
            exit 1
          fi
          echo "Verified LibreBuds 6i fork signing certificate fingerprint."

          # Legacy Stable may have been deleted. Its original signature is
          # incompatible with this new fork signing lineage in either case.
          "$aapt" dump badging "$candidate" > "$RUNNER_TEMP/new-badging.txt"
          if gh release view Stable >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/old-stable"
            gh release download Stable --pattern librebuds.apk --dir "$RUNNER_TEMP/old-stable"
            previous="$RUNNER_TEMP/old-stable/librebuds.apk"
            if [ -s "$previous" ]; then
              "$aapt" dump badging "$previous" > "$RUNNER_TEMP/old-badging.txt"
            fi
          fi

          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          def package_info(file):
              text = (root / file).read_text()
              match = re.search(r"^package: name='([^']+)' versionCode='(\\d+)' versionName='([^']+)'", text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"Cannot read APK metadata from {file}")
              return match.group(1), int(match.group(2)), match.group(3)
          new = package_info("new-badging.txt")
          if new != ("io.github.librebuds", 20, "1.0.0"):
              raise SystemExit(f"Unexpected release package, versionCode or versionName: {new}")
          if (root / "old-badging.txt").exists():
              old = package_info("old-badging.txt")
              if old[0] != new[0] or new[1] <= old[1]:
                  raise SystemExit("New APK does not increment the prior Stable release version")
          print("Verified LibreBuds 6i v1.0.0; previous signing identity requires clean install.")
          PY

          cp "$candidate" "$RUNNER_TEMP/librebuds.apk"
          (cd "$RUNNER_TEMP" && sha256sum librebuds.apk > librebuds.apk.sha256)

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/keystore.properties android/release-keystore.jks

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: librebuds-v1.0.0-signed-apk
          path: |
            ${{ runner.temp }}/librebuds.apk
            ${{ runner.temp }}/librebuds.apk.sha256
          if-no-files-found: error

      - name: Publish stable v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.0 \
            "$RUNNER_TEMP/librebuds.apk#librebuds.apk" \
            "$RUNNER_TEMP/librebuds.apk.sha256#librebuds.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "LibreBuds 6i v1.0.0 — Stable" \
            --notes-file RELEASE_NOTES_v1.0.0.md \
            --latest
